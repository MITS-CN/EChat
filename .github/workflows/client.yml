name: Client CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'echat-client/**' # 只有改动客户端代码才会触发
      - '.github/workflows/client.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'echat-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./echat-client # 预计未来的客户端目录名

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # 如果你用 Maven，改成 'maven'

    # 如果你的 Java 客户端是用 Gradle 构建的（Minecraft 模组常用）
    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew build --no-daemon