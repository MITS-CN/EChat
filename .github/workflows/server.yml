name: Server CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'echat-server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'echat-server/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./echat-server

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: echat-server -> target

    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features
      continue-on-error: true # 🔽 这里是允许警告通过的关键

    - name: Build
      run: cargo build --release

  release:
    name: Build Release Binary
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./echat-server

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: echat-server -> target

    - name: Build Release
      run: cargo build --release

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: echat-server-linux
        path: echat-server/target/release/echat-server